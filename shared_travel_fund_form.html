<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shared Travel Fund</title>
<style>
:root {
  --navy:#1F3864;--blue:#2E75B6;--blue-lt:#DAE3F3;
  --border:#D0D7E0;--surface:#F4F6FA;--white:#ffffff;
  --text:#1a1a1a;--muted:#6b7280;--red:#DC2626;
  --radius:10px; color-scheme:light;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{background:#ffffff;}
body{font-family:Arial,sans-serif;background:#ffffff;color:var(--text);min-height:100vh;}
.page{max-width:920px;margin:0 auto;padding:20px 16px 60px;}

/* Banner */
.banner{background:linear-gradient(135deg,var(--navy) 0%,var(--blue) 100%);border-radius:14px;padding:20px 24px;color:#fff;margin-bottom:20px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;}
.banner h1{font-size:20px;font-weight:800;}
.banner p{font-size:11px;opacity:0.7;margin-top:2px;}
.save-status{font-size:11px;opacity:0.9;display:flex;align-items:center;gap:5px;white-space:nowrap;}
.save-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;}
.save-dot.saving{background:#fbbf24;animation:pulse 0.8s infinite;}
.save-dot.error{background:#f87171;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:0.3;}}

/* Cards */
.card{background:#ffffff;border-radius:12px;border:1px solid var(--border);padding:18px 20px;margin-bottom:18px;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.card-title{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:0.6px;color:var(--navy);border-bottom:2px solid var(--blue-lt);padding-bottom:7px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}

/* Trip grid */
.trip-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:0.4px;}
.field input,.field select{border:1.5px solid var(--border);border-radius:8px;padding:7px 10px;font-size:13px;background:#ffffff;color:var(--text);outline:none;width:100%;transition:border-color 0.15s;}
.field input:focus,.field select:focus{border-color:var(--blue);}
.field.full{grid-column:1/-1;}

/* Table */
.table-wrap{overflow-x:auto;border-radius:10px;border:1.5px solid var(--border);}
table{width:100%;border-collapse:collapse;min-width:660px;}
thead tr{background:var(--navy);}
th{padding:9px 10px;text-align:left;font-size:11px;font-weight:700;color:#fff;white-space:nowrap;letter-spacing:0.3px;}
th.center,td.center{text-align:center;}
tbody tr{border-bottom:1px solid var(--border);background:#ffffff;}
tbody tr:last-child{border-bottom:none;}
tbody tr:hover{background:var(--surface);}
tbody tr.weekend-row{background:#FFF8F4;}
tbody tr.weekend-row:hover{background:#FEEEE4;}
td{padding:5px 8px;vertical-align:middle;}
td input,td select{border:1.5px solid transparent;border-radius:6px;padding:6px 8px;font-size:12px;background:transparent;color:var(--text);width:100%;outline:none;transition:border-color 0.15s,background 0.15s;}
td input:focus,td select:focus{border-color:var(--blue);background:#ffffff;}
td input::placeholder{color:var(--muted);}
.col-num{width:36px;}.col-date{width:120px;}.col-day{width:44px;}
.col-desc{min-width:180px;}.col-amt{width:110px;}.col-del{width:34px;}

/* Badges */
.row-num{display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:var(--blue-lt);color:var(--navy);font-size:11px;font-weight:700;margin:0 auto;}
.day-badge{font-size:10px;font-weight:700;padding:2px 5px;border-radius:5px;display:inline-block;white-space:nowrap;}
.day-mon,.day-tue,.day-wed,.day-thu,.day-fri{background:#EEF2FF;color:#3730A3;}
.day-sat{background:#FEF3C7;color:#92400E;}
.day-sun{background:#FEE2E2;color:#991B1B;}
.day-ph{background:#FCE7F3;color:#9D174D;font-style:italic;}

/* Del btn */
.del-btn{background:none;border:none;color:#CBD5E1;cursor:pointer;font-size:15px;padding:2px 4px;border-radius:4px;}
.del-btn:hover{color:var(--red);background:#FEE2E2;}

/* Add row */
.add-row-btn{display:flex;align-items:center;gap:8px;margin-top:10px;padding:8px 14px;background:none;border:1.5px dashed var(--border);border-radius:8px;color:var(--blue);font-size:13px;font-weight:600;cursor:pointer;width:100%;transition:all 0.15s;}
.add-row-btn:hover{background:var(--blue-lt);border-color:var(--blue);}

/* Total */
.total-area{display:flex;justify-content:flex-end;margin-top:4px;}
.total-box{background:var(--navy);color:#fff;border-radius:10px;padding:14px 20px;min-width:250px;}
.total-row-line{display:flex;justify-content:space-between;font-size:13px;margin-bottom:5px;opacity:0.85;}
.total-grand{font-size:20px;font-weight:800;padding-top:8px;border-top:1px solid rgba(255,255,255,0.2);margin-top:8px;display:flex;justify-content:space-between;align-items:baseline;}
.per-pax{font-size:11px;opacity:0.65;margin-top:3px;text-align:right;}

/* Actions */
.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px;}
.btn{padding:9px 20px;border-radius:8px;font-size:13px;font-weight:700;cursor:pointer;border:none;transition:opacity 0.15s;}
.btn-primary{background:var(--navy);color:#fff;}
.btn-save{background:#166534;color:#fff;}
.btn-secondary{background:var(--blue-lt);color:var(--navy);}
.btn-danger{background:#FEE2E2;color:var(--red);}
.btn:hover{opacity:0.85;}

/* Toast */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1a1a1a;color:#fff;padding:10px 20px;border-radius:8px;font-size:13px;z-index:1000;opacity:0;transition:opacity 0.3s;pointer-events:none;}
.toast.show{opacity:1;}

.ph-note{font-size:10px;color:var(--muted);margin-top:6px;font-style:italic;}

/* Print */
@media print {
  .actions,.add-row-btn,.del-btn,.save-status{display:none!important;}
  .banner{border-radius:0;margin-bottom:12px;}
  .card{box-shadow:none;border:1px solid #ccc;}
  .table-wrap{border:none;}
}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div class="page">
  <!-- Banner -->
  <div class="banner">
    <div>
      <h1>✈️ Shared Travel Fund</h1>
      <p>Data saves automatically to this device — no account needed.</p>
    </div>
    <div class="save-status">
      <div class="save-dot" id="save-dot"></div>
      <span id="save-label">Ready</span>
    </div>
  </div>

  <!-- Trip Details -->
  <div class="card">
    <div class="card-title">🗺️ Trip Details</div>
    <div class="trip-grid">
      <div class="field full">
        <label>Country / Destination</label>
        <input type="text" id="destination" placeholder="e.g. Japan, Bali, South Korea…" oninput="scheduleSave()">
      </div>
      <div class="field">
        <label>Trip Start Date</label>
        <input type="date" id="trip-start" onchange="onTripDatesChange()">
      </div>
      <div class="field">
        <label>Trip End Date</label>
        <input type="date" id="trip-end" onchange="onTripDatesChange()">
      </div>
      <div class="field">
        <label>Trip Duration</label>
        <input type="text" id="duration" readonly placeholder="— days" style="color:var(--muted);background:var(--surface);">
      </div>
      <div class="field">
        <label>Number of Pax</label>
        <input type="number" id="pax" min="1" max="99" value="1" oninput="renderTotals();scheduleSave()">
      </div>
      <div class="field">
        <label>Currency</label>
        <select id="currency" onchange="renderTotals();scheduleSave()">
          <option value="SGD">SGD — Singapore Dollar</option>
          <option value="MYR">MYR — Malaysian Ringgit</option>
          <option value="IDR">IDR — Indonesian Rupiah</option>
          <option value="KRW">KRW — Korean Won</option>
          <option value="USD">USD — US Dollar</option>
          <option value="HKD">HKD — Hong Kong Dollar</option>
          <option value="TWD">TWD — Taiwan Dollar</option>
          <option value="CNY">CNY — Chinese Yuan</option>
          <option value="EUR">EUR — Euro</option>
          <option value="AUD">AUD — Australian Dollar</option>
          <option value="JPY">JPY — Japanese Yen</option>
          <option value="THB">THB — Thai Baht</option>
          <option value="VND">VND — Vietnamese Dong</option>
          <option value="PHP">PHP — Philippine Peso</option>
          <option value="GBP">GBP — British Pound</option>
        </select>
      </div>
    </div>
  </div>

  <!-- Expense Table -->
  <div class="card">
    <div class="card-title">
      🧾 Expense Items
      <span style="font-size:10px;font-weight:400;color:var(--muted);">Auto-saved to this device</span>
    </div>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th class="col-num center">#</th>
            <th class="col-date">Date</th>
            <th class="col-day center">Day</th>
            <th class="col-desc">Description</th>
            <th class="col-amt" style="text-align:right;">Amount</th>
            <th class="col-del"></th>
          </tr>
        </thead>
        <tbody id="expense-body"></tbody>
      </table>
    </div>
    <p class="ph-note">🔴 Sun &nbsp;·&nbsp; 🟡 Sat &nbsp;·&nbsp; 🩷 PH — highlighted automatically from date selected</p>
    <button class="add-row-btn" onclick="addRow()">＋ &nbsp;Add another line</button>
  </div>

  <!-- Totals -->
  <div class="total-area">
    <div class="total-box">
      <div class="total-row-line"><span>Subtotal</span><span id="tot-sub">0.00</span></div>
      <div class="total-grand">
        <span>Total <span id="tot-cur-label" style="font-size:13px;opacity:0.7;font-weight:400;">SGD</span></span>
        <span id="tot-grand">0.00</span>
      </div>
      <div class="per-pax" id="tot-per-pax"></div>
    </div>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="btn btn-save" onclick="saveNow()">💾 Save Now</button>
    <button class="btn btn-primary" onclick="window.print()">🖨️ Print / PDF</button>
    <button class="btn btn-danger" onclick="clearAll()">🗑️ Clear All</button>
  </div>
</div>

<script>
const STORAGE_KEY = "trip_expense_v1";

const SG_PH = new Set([
  "2024-01-01","2024-02-10","2024-02-11","2024-02-12","2024-03-29","2024-04-10",
  "2024-05-01","2024-05-22","2024-06-17","2024-08-09","2024-10-31","2024-12-25",
  "2025-01-01","2025-01-29","2025-01-30","2025-03-31","2025-04-18","2025-05-01",
  "2025-05-12","2025-06-07","2025-08-09","2025-10-20","2025-12-25",
  "2026-01-01","2026-02-17","2026-02-18","2026-03-20","2026-04-03","2026-05-01",
  "2026-05-27","2026-06-26","2026-08-10","2026-11-09","2026-12-25",
]);

const DESC_OPTIONS = [
  "Breakfast","Lunch","Dinner","Drinks","Desserts","Snacks",
  "Grab / Ride-hail","Petrol","Tolls","Parking",
  "MRT / Bus / Train","Boat / Ferry Ride","Flight / Tickets",
  "Accommodation","Massage / Spa","Entrance Tickets",
  "Shopping","Shared Travel Fund","Others"
];
const DAY_LABELS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];

let rowCount = 0;
let saveTimer = null;

// ── Save status ────────────────────────────────────────────────────────────────
function setSaveStatus(state) {
  const dot = document.getElementById("save-dot");
  const lbl = document.getElementById("save-label");
  if (state==="saving")  { dot.className="save-dot saving"; lbl.textContent="Saving…"; }
  if (state==="saved")   { dot.className="save-dot";        lbl.textContent="Saved ✓"; }
  if (state==="unsaved") { dot.className="save-dot saving"; lbl.textContent="Unsaved"; }
  if (state==="error")   { dot.className="save-dot error";  lbl.textContent="Error"; }
}

function showToast(msg, dur=2500) {
  const t = document.getElementById("toast");
  t.textContent=msg; t.classList.add("show");
  setTimeout(()=>t.classList.remove("show"), dur);
}

// ── localStorage save/load ─────────────────────────────────────────────────────
function scheduleSave() {
  setSaveStatus("unsaved");
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNow, 1500);
}

function saveNow() {
  clearTimeout(saveTimer);
  setSaveStatus("saving");
  try {
    const data = {
      destination: document.getElementById("destination").value,
      tripStart:   document.getElementById("trip-start").value,
      tripEnd:     document.getElementById("trip-end").value,
      pax:         document.getElementById("pax").value,
      currency:    document.getElementById("currency").value,
      rows: collectRows(),
      savedAt: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
    setSaveStatus("saved");
    showToast("✅ Saved to this device");
  } catch(e) {
    setSaveStatus("error");
    showToast("⚠️ Could not save — storage may be full");
    console.error(e);
  }
}

function collectRows() {
  const rows = [];
  document.querySelectorAll("#expense-body tr").forEach(tr => {
    const id = tr.id.replace("row-","");
    rows.push({
      date:   document.getElementById("date-"+id)?.value  || "",
      desc:   document.getElementById("desc-"+id)?.value  || "",
      amount: document.getElementById("amt-"+id)?.value   || "",
    });
  });
  return rows;
}

function loadSaved() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : null;
  } catch(e) { return null; }
}

// ── Date helpers ───────────────────────────────────────────────────────────────
function getDayInfo(dateStr) {
  if (!dateStr) return { label:"—", cls:"" };
  const dt = new Date(dateStr+"T00:00:00");
  const dow = dt.getDay();
  if (SG_PH.has(dateStr)) return { label:"PH", cls:"day-ph" };
  if (dow===0) return { label:"Sun", cls:"day-sun" };
  if (dow===6) return { label:"Sat", cls:"day-sat" };
  return { label:DAY_LABELS[dow], cls:"day-"+DAY_LABELS[dow].toLowerCase() };
}

function isWeekendOrPH(dateStr) {
  if (!dateStr) return false;
  const dt = new Date(dateStr+"T00:00:00");
  return dt.getDay()===0 || dt.getDay()===6 || SG_PH.has(dateStr);
}

function buildDateOptions(selectedVal) {
  const start = document.getElementById("trip-start").value;
  const end   = document.getElementById("trip-end").value;
  let opts = `<option value="">— select date —</option>`;
  if (start && end) {
    let cur = new Date(start+"T00:00:00");
    const last = new Date(end+"T00:00:00");
    while (cur <= last) {
      const iso = cur.toISOString().slice(0,10);
      const dayName = DAY_LABELS[cur.getDay()];
      const isPH = SG_PH.has(iso);
      const label = iso+" ("+(isPH?"PH·"+dayName:dayName)+")";
      opts += `<option value="${iso}"${iso===selectedVal?" selected":""}>${label}</option>`;
      cur.setDate(cur.getDate()+1);
    }
  } else {
    opts += `<option disabled>— set trip dates above first —</option>`;
  }
  return opts;
}

// ── Row management ─────────────────────────────────────────────────────────────
function addRow(dateVal="", descVal="", amtVal="") {
  rowCount++;
  const id = rowCount;
  const tbody = document.getElementById("expense-body");
  const tr = document.createElement("tr");
  tr.id = "row-"+id;
  if (isWeekendOrPH(dateVal)) tr.classList.add("weekend-row");
  const dayInfo = getDayInfo(dateVal);
  tr.innerHTML = `
    <td class="center"><div class="row-num">${id}</div></td>
    <td><select id="date-${id}" onchange="onDateChange(${id});scheduleSave()" style="min-width:130px;">${buildDateOptions(dateVal)}</select></td>
    <td class="center"><span class="day-badge ${dayInfo.cls}" id="day-${id}">${dayInfo.label}</span></td>
    <td><select id="desc-${id}" onchange="scheduleSave()" style="min-width:178px;">
      <option value="">— select —</option>
      ${DESC_OPTIONS.map(d=>`<option${d===descVal?" selected":""}>${d}</option>`).join("")}
    </select></td>
    <td><input type="number" id="amt-${id}" min="0" step="0.01" placeholder="0.00"
         value="${amtVal}" oninput="renderTotals();scheduleSave()" style="text-align:right;"></td>
    <td class="center"><button class="del-btn" onclick="delRow(${id})" title="Delete">✕</button></td>`;
  tbody.appendChild(tr);
  renumberRows();
  renderTotals();
}

function onDateChange(id) {
  const val = document.getElementById("date-"+id).value;
  const info = getDayInfo(val);
  const badge = document.getElementById("day-"+id);
  if (badge) { badge.className="day-badge "+info.cls; badge.textContent=info.label; }
  const tr = document.getElementById("row-"+id);
  if (tr) {
    if (isWeekendOrPH(val)) tr.classList.add("weekend-row");
    else tr.classList.remove("weekend-row");
  }
}

function delRow(id) {
  document.getElementById("row-"+id)?.remove();
  renumberRows(); renderTotals(); scheduleSave();
}

function renumberRows() {
  document.querySelectorAll("#expense-body tr").forEach((tr,i) => {
    const b = tr.querySelector(".row-num");
    if (b) b.textContent = i+1;
  });
}

function onTripDatesChange() {
  const start = document.getElementById("trip-start").value;
  const end   = document.getElementById("trip-end").value;
  if (start && end) {
    const diff = Math.round((new Date(end+"T00:00:00")-new Date(start+"T00:00:00"))/86400000)+1;
    document.getElementById("duration").value = diff>0 ? diff+" day"+(diff>1?"s":"") : "—";
  } else {
    document.getElementById("duration").value = "";
  }
  document.querySelectorAll("#expense-body tr").forEach(tr => {
    const id = tr.id.replace("row-","");
    const sel = document.getElementById("date-"+id);
    if (!sel) return;
    const cur = sel.value;
    sel.innerHTML = buildDateOptions(cur);
    onDateChange(id);
  });
  scheduleSave();
}

function renderTotals() {
  let sub = 0;
  document.querySelectorAll("#expense-body tr").forEach(tr => {
    const id = tr.id.replace("row-","");
    const v = parseFloat(document.getElementById("amt-"+id)?.value||0);
    if (!isNaN(v)) sub += v;
  });
  const pax = parseInt(document.getElementById("pax").value)||1;
  const cur = document.getElementById("currency").value;
  document.getElementById("tot-sub").textContent = sub.toFixed(2);
  document.getElementById("tot-cur-label").textContent = cur;
  document.getElementById("tot-grand").textContent = sub.toFixed(2);
  document.getElementById("tot-per-pax").textContent =
    pax>1 ? `Per pax: ${cur} ${(sub/pax).toFixed(2)}` : "";
}

function populateForm(data) {
  if (!data) { addRow(); addRow(); addRow(); setSaveStatus("saved"); return; }
  document.getElementById("destination").value = data.destination || "";
  document.getElementById("trip-start").value  = data.tripStart   || "";
  document.getElementById("trip-end").value    = data.tripEnd     || "";
  document.getElementById("pax").value         = data.pax         || "1";
  if (data.currency) document.getElementById("currency").value = data.currency;
  if (data.tripStart && data.tripEnd) {
    const diff = Math.round((new Date(data.tripEnd+"T00:00:00")-new Date(data.tripStart+"T00:00:00"))/86400000)+1;
    document.getElementById("duration").value = diff>0 ? diff+" day"+(diff>1?"s":"") : "—";
  }
  const rows = data.rows||[];
  if (rows.length===0) { addRow(); addRow(); addRow(); }
  else rows.forEach(r => addRow(r.date, r.desc, r.amount));
  renderTotals();
  setSaveStatus("saved");
}

function clearAll() {
  if (!confirm("Clear everything and start fresh?")) return;
  ["destination","trip-start","trip-end","duration"].forEach(id=>document.getElementById(id).value="");
  document.getElementById("pax").value="1";
  document.getElementById("expense-body").innerHTML="";
  rowCount=0; renderTotals();
  addRow(); addRow(); addRow();
  saveNow();
}

// ── Init ───────────────────────────────────────────────────────────────────────
populateForm(loadSaved());
</script>
</body>
</html>
